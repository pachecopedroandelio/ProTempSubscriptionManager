services:
  - type: web
    name: protemp-subscriptions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: protemp-subscriptions-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: protemp-subscriptions-db
    databaseName: protemp_subscriptions
    user: protemp_subscriptions
    plan: basic-256mb
